# Enable SSE4.1 on x86_64 (available on essentially all x86_64 CPUs since
# ~2008). Besides general code generation, this makes the build script of
# minimap2-sys (used by `modkit modbam align`) compile minimap2's SSE4.1
# alignment kernels instead of the slower SSE2-only fallback.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-feature=+sse4.1"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "target-feature=+sse4.1"]
